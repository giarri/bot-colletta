name: Deploy

# Tests, then deploys the app to Azure on every push to main. Terraform only applies when infra/ changed (or on a manual run).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'rg-bot-colletta' }}
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            infra:
              - 'infra/**'
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Initialise Terraform
        id: infra
        working-directory: infra
        run: |
          terraform init -input=false -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE }}"
          echo "functionapp=$(terraform output -raw function_app_name)" >> "$GITHUB_OUTPUT"
          echo "vault=$(terraform output -raw key_vault_name)" >> "$GITHUB_OUTPUT"

      # Only touch Azure resources when the infrastructure code changed (or on a manual run).
      - name: Provision infrastructure
        if: steps.changes.outputs.infra == 'true' || github.event_name == 'workflow_dispatch'
        working-directory: infra
        run: terraform apply -input=false -auto-approve -var="resource_group_name=$AZURE_RESOURCE_GROUP"

      - name: Read the Telegram token for the command menu
        run: |
          token=$(az keyvault secret show --vault-name "${{ steps.infra.outputs.vault }}" -n telegram-token --query value -o tsv)
          echo "::add-mask::$token"
          echo "TELEGRAM_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Deploy the app, check health, update the command menu
        env:
          AZURE_FUNCTIONAPP: ${{ steps.infra.outputs.functionapp }}
        run: python3 deploy.py
