name: Infra what-if

# Shows what a pull request would change in Azure. Skipped for forks, which get no OIDC token.
on:
  pull_request:
    paths: [infra/**, .github/workflows/infra-whatif.yml]

permissions:
  id-token: write
  contents: read

jobs:
  whatif:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: What-if
        run: |
          az deployment group what-if -g "${{ vars.AZURE_RESOURCE_GROUP || 'rg-bot-colletta' }}" \
            -f infra/main.bicep -p infra/main.bicepparam
